name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Colibri.slnx

      - name: Build
        run: dotnet build Colibri.slnx -c Release --no-restore

      # Avalonia UI tests use the headless platform, so no display server is needed on Linux.
      - name: Test
        run: dotnet test Colibri.slnx -c Release --no-build

      # The extension's pure logic is plain JavaScript tested with Node's built-in runner; once is enough.
      - uses: actions/setup-node@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: 24

      - name: Test extension
        if: matrix.os == 'ubuntu-latest'
        run: node --test "extension/tests/*.test.js"
