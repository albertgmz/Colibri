<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" alt="" width="20" height="20">
    <h1 data-i18n="extName"></h1>
  </header>

  <label class="toggle">
    <span data-i18n="popupCapture"></span>
    <input type="checkbox" id="enabled" role="switch">
  </label>
  <p class="hint" data-i18n="popupCaptureHint"></p>

  <p class="status" id="status" data-state="checking">
    <span class="dot" aria-hidden="true"></span>
    <span id="status-text" data-i18n="popupStatusChecking"></span>
  </p>
</body>
</html>
